name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Package Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Prepare desktop runtime
        env:
          AOTU_MEDIA_SALT: ${{ secrets.AOTU_MEDIA_SALT }}
        run: npm run desktop:prepare

      - name: Build Windows installer
        run: npm exec electron-builder -- --win nsis --publish never

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = $tag -replace "^v", ""
          $assets = @(
            Get-ChildItem release -File -Filter "*.exe"
            Get-ChildItem release -File -Filter "*.exe.blockmap"
            Get-Item release/latest.yml
          )

          if (-not $assets) {
            throw "No release assets were produced."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets.FullName --clobber
            gh release edit $tag --title $title
          } else {
            gh release create $tag $assets.FullName --title $title --generate-notes
          }

          $desiredNames = $assets.Name
          $existingNames = gh release view $tag --json assets --jq ".assets[].name"
          foreach ($assetName in $existingNames) {
            if ($assetName -notin $desiredNames) {
              gh release delete-asset $tag --yes -- $assetName
            }
          }
