<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.78"
      numOctaves="4"
      seed="12"
      stitchTiles="stitch"
      result="noise"
    />
    <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="0.58" intercept="0.2" />
      <feFuncG type="linear" slope="0.58" intercept="0.2" />
      <feFuncB type="linear" slope="0.58" intercept="0.2" />
      <feFuncA type="linear" slope="0.34" />
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.28" />
</svg>
